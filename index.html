<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cello 1-Bar-Ahead Sight Reader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎻</text></svg>">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .piece-banner {
      width: 100%;
      max-width: 960px;
      background: #ffffff;
      border-radius: 10px;
      padding: 0.85rem 1.25rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .piece-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1e293b;
      margin: 0;
    }
    .piece-meta {
      font-size: 0.85rem;
      font-weight: 500;
      color: #64748b;
    }
    #chorale-select {
      max-width: 280px;
    }
    #notation-card {
      max-width: 960px;
      padding: 1.5rem;
    }
    .notation-row {
      display: flex;
      gap: 1.25rem;
      justify-content: center;
      align-items: stretch;
      flex-wrap: wrap;
      width: 100%;
    }
    .bar-slot {
      flex: 1 1 380px;
      max-width: 560px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.65rem 0.75rem 0.25rem;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .bar-slot.playing-now {
      border-color: #2b59c3;
      background: #f8faff;
    }
    .bar-slot.look-ahead {
      border-color: #cbd5e1;
      background: #ffffff;
    }
    .slot-badge {
      align-self: flex-start;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 0.2rem 0.55rem;
      border-radius: 5px;
      margin-bottom: 0.25rem;
    }
    .playing-now .slot-badge {
      background: #dbeafe;
      color: #1e40af;
    }
    .look-ahead .slot-badge {
      background: #f1f5f9;
      color: #475569;
    }
  </style>
</head>
<body>

  <h2>Cello 1-Bar-Ahead Sight Reader</h2>

  <div class="controls">
    <label>Chorale:
      <select id="chorale-select" disabled>
        <option>Loading Bach chorales...</option>
      </select>
    </label>
    <button id="random-btn" disabled>Random</button>
    <label>View:
      <select id="bar-mode">
        <option value="2" selected>2 Bars (Easier)</option>
        <option value="1">1 Bar (Hard)</option>
      </select>
    </label>
    <label>BPM:
      <input type="number" id="bpm" value="72" min="40" max="180" />
    </label>
    <label>
      <input type="checkbox" id="click-track" checked /> Clicks
    </label>
    <label>
      <input type="checkbox" id="mute-cello" checked /> Mute Cello
    </label>
    <button id="start-btn" disabled>Start</button>
    <button id="stop-btn" class="stop" disabled>Stop</button>
  </div>

  <div class="piece-banner">
    <h3 class="piece-title" id="piece-title">Loading score...</h3>
    <div class="piece-meta" id="piece-meta">—</div>
  </div>

  <div class="status" id="status-text">Initializing modules...</div>

  <div class="beat-bar" id="beat-bar"></div>

  <div id="notation-card">
    <div id="notation-output" class="notation-row">Loading Cello notation...</div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
