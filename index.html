<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cello 1-Bar-Ahead Sight Reader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎻</text></svg>">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <h2>Cello 1-Bar-Ahead Trainer</h2>

  <div class="controls">
    <label>Tempo (BPM):
      <input type="number" id="bpm" value="72" min="40" max="180" />
    </label>
    <label>Test Meter:
      <select id="test-meter">
        <option value="4/4" selected>4/4 (4 beats)</option>
        <option value="3/4">3/4 (3 beats)</option>
        <option value="2/4">2/4 (2 beats)</option>
        <option value="6/8">6/8 (2 dotted-quarter beats)</option>
        <option value="2/2">2/2 Cut Time (2 half-note beats)</option>
        <option value="mixed">Mixed (4/4 → 3/4 → 6/8)</option>
      </select>
    </label>
    <label>
      <input type="checkbox" id="click-track" checked /> Metronome Clicks
    </label>
    <label>
      <input type="checkbox" id="mute-cello" checked /> Mute Cello Voice
    </label>
    <button id="start-btn">Start</button>
    <button id="stop-btn" class="stop" disabled>Stop</button>
  </div>

  <div class="status" id="status-text">Stage 2 Ready — Press Start to test audio + 1-bar-ahead clock.</div>

  <div class="beat-bar" id="beat-bar"></div>

  <div id="notation-card">
    <div class="placeholder-bar" id="display-bar">Bar 1 (Ready to Read)</div>
    <div class="placeholder-sub" id="display-sub">Hardcoded 4-bar chorale cadence ready to test audio sync.</div>
  </div>

  <script type="module">
    import { SightReadClock } from "./js/clock.js";
    import { SightReadAudio } from "./js/audio.js";

    const startBtn = document.getElementById("start-btn");
    const stopBtn = document.getElementById("stop-btn");
    const bpmInput = document.getElementById("bpm");
    const meterSelect = document.getElementById("test-meter");
    const clickCheckbox = document.getElementById("click-track");
    const muteCelloCheckbox = document.getElementById("mute-cello");
    const statusText = document.getElementById("status-text");
    const beatBar = document.getElementById("beat-bar");
    const displayBar = document.getElementById("display-bar");
    const displaySub = document.getElementById("display-sub");

    const audio = new SightReadAudio();

    // Hardcoded 4-bar test progression (SATB voices) to verify Stage 2 audio sync
    const TEST_SCORE_BARS = [
      // Bar 1: C major
      [
        { pitch: "E4", beatOffset: 0, durationBeats: 2, isCello: false },
        { pitch: "G4", beatOffset: 0, durationBeats: 2, isCello: false },
        { pitch: "C3", beatOffset: 0, durationBeats: 1, isCello: true },
        { pitch: "E3", beatOffset: 1, durationBeats: 1, isCello: true },
        { pitch: "F4", beatOffset: 2, durationBeats: 2, isCello: false },
        { pitch: "A4", beatOffset: 2, durationBeats: 2, isCello: false },
        { pitch: "F3", beatOffset: 2, durationBeats: 2, isCello: true }
      ],
      // Bar 2: G7
      [
        { pitch: "D4", beatOffset: 0, durationBeats: 2, isCello: false },
        { pitch: "G4", beatOffset: 0, durationBeats: 2, isCello: false },
        { pitch: "B2", beatOffset: 0, durationBeats: 1, isCello: true },
        { pitch: "G2", beatOffset: 1, durationBeats: 1, isCello: true },
        { pitch: "F4", beatOffset: 2, durationBeats: 2, isCello: false },
        { pitch: "B4", beatOffset: 2, durationBeats: 2, isCello: false },
        { pitch: "D3", beatOffset: 2, durationBeats: 2, isCello: true }
      ],
      // Bar 3: A minor -> F
      [
        { pitch: "E4", beatOffset: 0, durationBeats: 2, isCello: false },
        { pitch: "C5", beatOffset: 0, durationBeats: 2, isCello: false },
        { pitch: "A2", beatOffset: 0, durationBeats: 2, isCello: true },
        { pitch: "F4", beatOffset: 2, durationBeats: 2, isCello: false },
        { pitch: "A4", beatOffset: 2, durationBeats: 2, isCello: false },
        { pitch: "F2", beatOffset: 2, durationBeats: 2, isCello: true }
      ],
      // Bar 4: C major resolution
      [
        { pitch: "E4", beatOffset: 0, durationBeats: 2, isCello: false },
        { pitch: "G4", beatOffset: 0, durationBeats: 2, isCello: false },
        { pitch: "C3", beatOffset: 0, durationBeats: 2, isCello: true }
      ]
    ];

    function renderBeatDots(count, activeBeat = -1) {
      beatBar.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const dot = document.createElement("div");
        dot.className = "beat-dot" + (i === activeBeat ? " active" : "");
        beatBar.appendChild(dot);
      }
    }

    function buildTestMeters(selection, totalBars) {
      const meters = [];
      for (let i = 0; i < totalBars; i++) {
        if (selection === "mixed") {
          const cycle = [
            { beats: 4, beatType: 4 },
            { beats: 3, beatType: 4 },
            { beats: 6, beatType: 8 }
          ];
          meters.push(cycle[i % cycle.length]);
        } else {
          const [beats, beatType] = selection.split("/").map(Number);
          meters.push({ beats, beatType });
        }
      }
      return meters;
    }

    renderBeatDots(4);

    const clock = new SightReadClock({
      onMeasureStart(playIndex, readIndex, meterInfo) {
        const totalBars = TEST_SCORE_BARS.length;
        const meterLabel = `${meterInfo.beats}/${meterInfo.beatType}`;
        const bpm = parseInt(bpmInput.value, 10) || 72;
        const beatDurationSec = 60 / bpm;

        if (playIndex === -1) {
          statusText.textContent = `COUNT-IN [${meterLabel}] — Read Bar 1 now!`;
          displayBar.textContent = "Reading: Bar 1";
          displaySub.textContent = "Count-in clicks playing...";
        } else {
          // Schedule accompaniment audio for Bar N (playIndex)
          audio.scheduleBar(
            TEST_SCORE_BARS[playIndex],
            beatDurationSec,
            muteCelloCheckbox.checked
          );

          if (readIndex < totalBars) {
            statusText.textContent = `Playing Bar ${playIndex + 1} [${meterLabel}] | Reading Bar ${readIndex + 1}`;
            displayBar.textContent = `Reading: Bar ${readIndex + 1}`;
            displaySub.textContent = `Audio playing Bar ${playIndex + 1} accompaniment`;
          } else {
            statusText.textContent = `Playing Final Bar (${playIndex + 1}) [${meterLabel}] | End of Piece`;
            displayBar.textContent = "End of Piece";
            displaySub.textContent = `Audio finishing Bar ${playIndex + 1}`;
          }
        }
      },

      onBeat(beatInBar, playIndex, readIndex, meterInfo) {
        renderBeatDots(meterInfo.feltBeats, beatInBar);
        // Always click during count-in (playIndex === -1), or if Metronome Clicks is checked
        if (playIndex === -1 || clickCheckbox.checked) {
          audio.playClick(beatInBar === 0);
        }
      },

      onFinish() {
        startBtn.disabled = false;
        stopBtn.disabled = true;
        renderBeatDots(4, -1);
        statusText.textContent = "Finished! Press Start to run again.";
        displayBar.textContent = "Bar 1 (Ready to Read)";
        displaySub.textContent = "Stage 2 audio + clock test completed cleanly.";
      }
    });

    startBtn.addEventListener("click", () => {
      audio.unlock(); // Unlock Web Audio synchronously inside click gesture
      const bpm = parseInt(bpmInput.value, 10) || 72;
      const measureMeters = buildTestMeters(meterSelect.value, TEST_SCORE_BARS.length);

      startBtn.disabled = true;
      stopBtn.disabled = false;
      clock.start({ bpm, measureMeters });
    });

    stopBtn.addEventListener("click", () => {
      clock.stop();
      audio.stopAll();
      startBtn.disabled = false;
      stopBtn.disabled = true;
      renderBeatDots(4, -1);
      statusText.textContent = "Stopped.";
      displayBar.textContent = "Bar 1 (Ready to Read)";
      displaySub.textContent = "Clock and audio reset.";
    });
  </script>
</body>
</html>
